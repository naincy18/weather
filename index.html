<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="weather-default">

    <div class="app">

        <!-- ========== SEARCH ========== -->
        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text"
                    id="city-input"
                    placeholder="Search for a city..."
                    autocomplete="off"
                >
                <button id="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <button id="location-btn" title="Use current location">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v4M12 19v4M1 12h4M19 12h4"></path>
                    </svg>
                </button>
            </div>

            <!-- Search history -->
            <div id="history" class="history"></div>
        </div>

         <!-- ========== LOADING ========== -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- ========== ERROR ========== -->
        <div id="error" class="error hidden">
            <p>🌧️ City not found. Please try again.</p>
        </div>

        <!-- ========== WEATHER RESULT ========== -->
        <div id="weather-result" class="weather-result hidden">

            <!-- Main card -->
            <div class="main-card glass">
                <div class="main-left">
                    <p id="city-name" class="city-name">--</p>
                    <p id="country" class="country">--</p>
                    <p id="date-time" class="date-time">--</p>
                    <div class="temp-row">
                        <p id="temperature" class="temperature">--°</p>
                        <img id="weather-icon" src="" alt="weather icon" class="weather-icon">
                    </div>
                    <p id="description" class="description">--</p>
                </div>
                <div class="main-right">
                    <div class="detail-item">
                        <span class="detail-icon">🌡️</span>
                        <div>
                            <p class="detail-label">Feels Like</p>
                            <p id="feels-like" class="detail-value">--</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">💧</span>
                        <div>
                            <p class="detail-label">Humidity</p>
                            <p id="humidity" class="detail-value">--</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">💨</span>
                        <div>
                            <p class="detail-label">Wind Speed</p>
                            <p id="wind" class="detail-value">--</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">👁️</span>
                        <div>
                            <p class="detail-label">Visibility</p>
                            <p id="visibility" class="detail-value">--</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">🌬️</span>
                        <div>
                            <p class="detail-label">Pressure</p>
                            <p id="pressure" class="detail-value">--</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">☁️</span>
                        <div>
                            <p class="detail-label">Cloudiness</p>
                            <p id="clouds" class="detail-value">--</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5-day forecast -->
            <div class="forecast-container">
                <p class="forecast-title">5-Day Forecast</p>
                <div id="forecast" class="forecast-grid"></div>
            </div>

        </div>

    <!-- ========== EMPTY STATE ========== -->
            <div id="empty-state" class="empty-state">
                <p class="empty-icon">🌤️</p>
                <p class="empty-title">Check the Weather</p>
                <p class="empty-desc">Search for a city or use your current location</p>
            </div>
 
    </div>

    <script src="script.js"></script>
    
</body>
</html>
